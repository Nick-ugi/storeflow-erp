# 배포용 전체 구성: PostgreSQL + Backend(Spring Boot) + Frontend(Nginx)
#   cp docker/.env.example docker/.env   # 비밀값 지정
#   docker compose -f docker/docker-compose.yml up -d --build
# 외부에는 Nginx 포트(APP_PORT)만 연다. DB · 백엔드는 compose 내부 네트워크에서만 접근한다.
# (로컬 개발용 DB는 저장소 루트의 docker-compose.yml)
name: storeflow-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-storeflow}
      POSTGRES_USER: ${DB_USERNAME:-storeflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?docker/.env에 DB_PASSWORD를 지정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: storeflow-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-storeflow}
      DB_USERNAME: ${DB_USERNAME:-storeflow}
      DB_PASSWORD: ${DB_PASSWORD:?docker/.env에 DB_PASSWORD를 지정하세요}
      JWT_SECRET: ${JWT_SECRET:?docker/.env에 JWT_SECRET(32자 이상)을 지정하세요}
      TZ: Asia/Seoul
    # 컨테이너 메모리 상한. JVM 힙 상한은 이 값의 75% (Dockerfile ENTRYPOINT)
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    image: storeflow-frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

volumes:
  db-data:

# 로컬 개발용 인프라 (PostgreSQL).
# 백엔드 · 프론트엔드(Nginx)까지 포함한 배포용 구성은 docker/docker-compose.yml
name: storeflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: storeflow-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-storeflow}
      POSTGRES_USER: ${DB_USERNAME:-storeflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storeflow}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
